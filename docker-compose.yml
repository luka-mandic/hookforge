# Production-shaped stack. Required secrets come from `.env` (never committed).
#   docker compose -f docker-compose.yml up -d --build --scale worker=3
# `docker-compose.override.yml` is merged automatically for local development.

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: production
  image: hookforge-app
  env_file:
    - ${ENV_FILE:-.env}
  restart: unless-stopped
  networks:
    - hookforge

services:
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: nginx
    image: hookforge-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      php-fpm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hookforge

  php-fpm:
    <<: *app
    environment:
      RUN_MIGRATIONS: "true"
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # No container_name and no published ports, so it scales: `--scale worker=3`.
  worker:
    <<: *app
    command: ["php", "artisan", "webhooks:work"]
    volumes:
      - storage_data:/var/www/html/storage
    stop_grace_period: 30s
    depends_on:
      php-fpm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan webhooks:work' > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE must be set}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hookforge

  # Reachable only on the internal network; add a password before exposing it.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - hookforge

  rabbitmq:
    image: rabbitmq:3.13-alpine
    restart: unless-stopped
    # RabbitMQ keys its data directory by hostname, so it must stay fixed for the volume to be reused.
    hostname: hookforge-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER must be set}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - hookforge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  storage_data:

networks:
  hookforge:
    driver: bridge
